[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vivy-failure-baseline-0"
version = "0.1.0"
description = "VIVY 人格内核第一份失败复现冻结工程"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Smash-TV"}]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gwen_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=tmp/pytest"]


[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
